# goreleaser config — driven by .github/workflows/release.yml on tag push.
# Test locally with `goreleaser release --snapshot --clean`.
version: 2
project_name: netcheck

before:
  hooks:
    - go mod tidy
    # Gate: same tests CI runs. Refuses to ship if anything fails, regardless
    # of whether ci.yml ran on this commit. Adds ~1m to release time — fine
    # for a low-frequency event, well worth the safety.
    - go test -race ./...
    # Generate Windows version-info .syso files (amd64 + arm64). The Go
    # compiler picks them up automatically when building for windows.
    # Uses the current git tag for FileVersion / ProductVersion.
    - go install github.com/tc-hib/go-winres@latest
    - go-winres make --arch amd64,arm64 --file-version git-tag --product-version git-tag

builds:
  - id: netcheck
    main: .
    binary: netcheck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strip debug info → ~30% smaller binaries.
      # -X stamps the version constant from the git tag (e.g. "0.8.0").
      - -s -w -X netcheck/cmd.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: netcheck
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: "^(feat|add)(\\(.+\\))?:"
      order: 0
    - title: Bug fixes
      regexp: "^(fix|bug)(\\(.+\\))?:"
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto # rc/beta/alpha tags publish as prerelease automatically
  name_template: "v{{ .Version }}"
  header: |
    ## netcheck {{ .Tag }}

    Cross-platform binaries are attached below. Pick the archive matching
    your OS and CPU, extract it, and the `netcheck` (or `netcheck.exe`) binary
    is ready to run.

    Verify downloads against `checksums.txt`:
    ```
    sha256sum -c checksums.txt
    ```
  footer: |
    ## Install

    **macOS / Linux:**
    ```bash
    # Replace darwin_arm64 with your platform (linux_amd64, darwin_amd64, linux_arm64, …)
    curl -L https://github.com/Dezoxy/netcheck/releases/download/{{ .Tag }}/netcheck_{{ .Version }}_darwin_arm64.tar.gz | tar xz
    sudo mv netcheck /usr/local/bin/
    netcheck version
    ```

    **Windows:**
    Download `netcheck_{{ .Version }}_windows_amd64.zip` (or `_arm64.zip` for ARM laptops), unzip, and run `netcheck.exe` from PowerShell or double-click for the interactive menu.

    **Build from source:** `git clone … && cd netcheck && make build`
