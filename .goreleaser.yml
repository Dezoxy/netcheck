# goreleaser config — driven by .github/workflows/release.yml on tag push.
# Test locally with `goreleaser release --snapshot --clean`.
version: 2
project_name: netcheck

before:
  hooks:
    - go mod tidy
    # Gate: same tests CI runs. Refuses to ship if anything fails, regardless
    # of whether ci.yml ran on this commit. Adds ~1m to release time — fine
    # for a low-frequency event, well worth the safety.
    - go test -race ./...
    # Generate Windows version-info .syso files (amd64 + arm64). The Go
    # compiler picks them up automatically when building for windows.
    # Uses the current git tag for FileVersion / ProductVersion.
    - go install github.com/tc-hib/go-winres@latest
    - go-winres make --arch amd64,arm64 --file-version git-tag --product-version git-tag

builds:
  - id: netcheck
    main: .
    binary: netcheck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strip debug info → ~30% smaller binaries.
      # -X stamps the version constant from the git tag (e.g. "0.8.0").
      - -s -w -X netcheck/cmd.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: netcheck
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - config.example.yaml

# Homebrew Cask — distributes the prebuilt macOS binary via Homebrew.
#
# Why Cask and not Formula: goreleaser v2 deprecated the `brews:` block in
# favour of `homebrew_casks:` since Cask is a better fit for prebuilt-binary
# distribution. Trade-off: Cask is macOS-only. Linux brew users keep the
# `linux_*.tar.gz` direct-download path off the release page.
#
# CURRENTLY DOES NOT PUSH. `skip_upload: true` makes goreleaser build the
# Cask file into ./dist/ for inspection without trying to commit it to the
# tap repo. To flip it live, follow docs/PUBLISHING.md (TL;DR: create the
# Dezoxy/homebrew-netcheck repo, add a `GORELEASER_PAT` secret, wire it into
# release-please.yml, set skip_upload: false).
homebrew_casks:
  - name: netcheck
    repository:
      owner: Dezoxy
      name: homebrew-netcheck
      # GORELEASER_PAT is the cross-repo personal access token (the workflow's
      # GITHUB_TOKEN can't push to a different repo). Missing token is fine
      # while skip_upload is true — see release-please.yml for the `|| ''`
      # fallback that keeps the workflow green pre-flip.
      token: "{{ .Env.GORELEASER_PAT }}"
    skip_upload: true
    homepage: "https://github.com/Dezoxy/netcheck"
    description: "Network diagnostic CLI — DNS, TCP, TLS, HTTP, traceroute, IP/ASN, pentest tooling."
    binaries: [netcheck]
    directory: Casks
    commit_author:
      name: goreleaser
      email: 178962833+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(cask): netcheck {{ .Tag }}"
    # Unsigned binaries trip macOS Gatekeeper ("netcheck cannot be opened
    # because the developer cannot be verified"). We don't notarize (no Apple
    # Developer account), so strip the quarantine attribute on install. This
    # is the goreleaser-documented workaround; the alternative is the user
    # running `xattr -dr com.apple.quarantine` themselves.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/netcheck"]
          end
    caveats: |
      Drop a config at ~/.config/netcheck/config.yaml — there's a template
      bundled inside the archive (config.example.yaml). Run `netcheck`
      without arguments for the interactive menu, or `netcheck help` for the
      full command list.

# Scoop bucket — generates a netcheck.json manifest for Windows users.
#
# Same activation flow as the tap (see docs/PUBLISHING.md): create
# Dezoxy/scoop-netcheck, reuse the GORELEASER_PAT secret, flip skip_upload.
scoops:
  - name: netcheck
    repository:
      owner: Dezoxy
      name: scoop-netcheck
      token: "{{ .Env.GORELEASER_PAT }}"
    skip_upload: true
    homepage: "https://github.com/Dezoxy/netcheck"
    description: "Network diagnostic CLI — DNS, TCP, TLS, HTTP, traceroute, IP/ASN, pentest tooling."
    license: "MIT"
    commit_author:
      name: goreleaser
      email: 178962833+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore(scoop): netcheck {{ .Tag }}"
    directory: bucket

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: "^(feat|add)(\\(.+\\))?:"
      order: 0
    - title: Bug fixes
      regexp: "^(fix|bug)(\\(.+\\))?:"
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  # release-please owns the tag + GitHub Release (notes, name, body).
  # goreleaser's job is just to attach the cross-platform binaries.
  # `mode: append` makes goreleaser add assets to the existing release
  # instead of trying to create a new one and 422-ing on conflict.
  mode: append
  draft: false
  prerelease: auto # rc/beta/alpha tags publish as prerelease automatically
  name_template: "v{{ .Version }}"
  header: |
    ## netcheck {{ .Tag }}

    Cross-platform binaries are attached below. Pick the archive matching
    your OS and CPU, extract it, and the `netcheck` (or `netcheck.exe`) binary
    is ready to run.

    Verify downloads against `checksums.txt`:
    ```
    sha256sum -c checksums.txt
    ```
  footer: |
    ## Install

    **macOS / Linux:**
    ```bash
    # Replace darwin_arm64 with your platform (linux_amd64, darwin_amd64, linux_arm64, …)
    curl -L https://github.com/Dezoxy/netcheck/releases/download/{{ .Tag }}/netcheck_{{ .Version }}_darwin_arm64.tar.gz | tar xz
    sudo mv netcheck /usr/local/bin/
    netcheck version
    ```

    **Windows:**
    Download `netcheck_{{ .Version }}_windows_amd64.zip` (or `_arm64.zip` for ARM laptops), unzip, and run `netcheck.exe` from PowerShell or double-click for the interactive menu.

    **Build from source:** `git clone … && cd netcheck && make build`
