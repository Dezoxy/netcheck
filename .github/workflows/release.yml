name: Release (manual backfill)

# Normal releases are produced by the goreleaser job inside release-please.yml
# (it runs in the same workflow run, conditional on a release being created).
#
# This workflow exists only for manual backfills — re-running goreleaser
# against an existing tag whose release page is missing binaries (e.g. because
# of historical workflow misconfigurations).
#
# Usage:
#   gh workflow run release.yml -f tag=v1.3.1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.1)'
        required: true
        type: string

permissions:
  contents: write # required so goreleaser can upload assets to the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the specified tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
