name: Release (manual backfill)

# Normal releases are produced by the goreleaser job inside release-please.yml
# (it runs in the same workflow run, conditional on a release being created).
#
# This workflow exists only for manual backfills — re-running goreleaser
# against an existing tag whose release page is missing binaries (e.g. because
# of historical workflow misconfigurations).
#
# Usage:
#   gh workflow run release.yml -f tag=v1.3.1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.1)'
        required: true
        type: string

permissions:
  contents: write # required so goreleaser can upload assets to the release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the specified tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for changelog
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          # --skip=docker: a backfill re-uploads missing binaries only. Building
          # images here would re-push :latest (and :MAJOR.MINOR) from an old
          # tag and roll every consumer back; this job also has no registry
          # login or packages: write.
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See release-please.yml for context. Empty fallback keeps backfills
          # working before the tap/bucket repos exist.
          GORELEASER_PAT: ${{ secrets.GORELEASER_PAT || '' }}
