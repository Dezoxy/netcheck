name: release-please

on:
  push:
    branches: [main]

# release-please needs to open PRs and tag/release. GITHUB_TOKEN's default
# write permissions on `contents` and `pull-requests` are sufficient.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
