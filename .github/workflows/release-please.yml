name: release-please

on:
  push:
    branches: [main]

# release-please needs to open PRs and tag/release. GITHUB_TOKEN's default
# write permissions on `contents` and `pull-requests` are sufficient.
permissions:
  contents: write
  pull-requests: write

# Opt googleapis/release-please-action@v4 into Node 24 ahead of GitHub's
# Sept 2026 Node 20 removal. Drop this when the action ships a Node-24
# native major (v5+) and we bump the pin.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
