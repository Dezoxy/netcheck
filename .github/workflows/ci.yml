name: CI

# CI runs on pull_request only. Direct pushes to main are blocked by branch
# protection, and the post-merge run was duplicate work — the squash commit
# carries the same code that just passed CI on the PR head.
#
# Tempting next step: add `paths-ignore` here to skip CI on release-please's
# CHANGELOG-bump PRs and docs-only diffs. DON'T — paths-ignore-skipped
# workflows show as "pending" in GitHub's required-checks API, so if
# branch protection ever requires the CI check, those PRs become
# unmergeable. The filter-job pattern (dorny/paths-filter + `if:` on the
# heavy jobs) is the safe form of that optimization; we're skipping it
# until the docs-PR CI minutes become a measurable problem.
on:
  pull_request:
    branches: [main]

# Cancel stale runs when a new push lands on the same PR. Saves minutes
# during active iteration; doesn't reduce per-PR run count.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-26.04 in every workflow, not ubuntu-latest
# (still 24.04 in September 2026): the OS under CI and releases changes only
# when a pull request changes this label, across all workflows at once.
jobs:
  test:
    name: lint + test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      # golangci-lint bundles gofmt, go vet, staticcheck, errcheck,
      # ineffassign, unused, bodyclose, errorlint, misspell, unconvert,
      # nilerr — the local pre-commit hook runs the same binary and the
      # same .golangci.yml, so a clean pre-commit run guarantees this
      # step is green. golangci/golangci-lint-action handles its own
      # binary install + caching.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # This pin MUST be a release built with a Go at least as new as
          # whatever `go-version: stable` above resolves to. golangci-lint
          # embeds go/types; a binary built with go1.N panics outright when
          # it type-checks transitively-imported go1.N+1 stdlib source
          # ("file requires newer Go version go1.N+1"), taking down every
          # PR until the pin moves.
          #
          # Recurs on each Go minor: v2.5.0 (built with Go 1.25) died when
          # stable became 1.26; v2.12.2 (Go 1.26) died when stable became
          # 1.27. Expect the same when 1.28 lands.
          #
          # Check a candidate's BUILD toolchain, not its go.mod: the `go`
          # directive there is the language minimum and reads lower than
          # reality (v2.13.1 declares go 1.26.0 but ships a go1.27.0 build).
          #   golangci-lint --version
          #   go version -m /path/to/golangci-lint | head -1
          version: v2.13.1

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -20

  web:
    name: web (lint + build)
    runs-on: ubuntu-26.04
    # The web/ tree was previously validated only by the lefthook pre-commit
    # hook, which Dependabot doesn't run. That's how #91 (@eslint/js 9→10)
    # merged green: CI never installed npm deps, so the peer-dep conflict
    # against eslint@9 / typescript-eslint@8 only surfaced on local `npm ci`.
    # This job closes that gap — npm ci catches lockfile/peer issues, lint
    # + format check catch what the pre-commit hook would have caught, and
    # `npm run build` exercises both `tsc --noEmit` and `vite build`.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pinned by major in web/.nvmrc, not lts/*: the committed UI bundle
          # is checked byte-for-byte below, so a Node upgrade should arrive
          # as its own reviewed change.
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: format check
        run: npm run format:check

      - name: build (tsc + vite)
        run: npm run build

      # internal/webui/dist is committed because go:embed and `go install`
      # need it at Go build time, and nothing else kept it in step with web/
      # (TD-001). The build is byte-identical across macOS and Linux on the
      # same Node major, so any difference here means the commit is stale.
      - name: committed UI bundle matches web/
        run: |
          changes="$(git status --porcelain -- ../internal/webui/dist)"
          if [ -n "$changes" ]; then
            echo "::error::internal/webui/dist is out of date. Run 'make web-build' and commit the result."
            echo "$changes"
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-26.04
    # Gate cross-compile on tests passing. Avoids burning 6× CI minutes when
    # the code already fails locally, and makes the failure flow read
    # sequentially: tests first, then platform-specific build problems. Also
    # depends on `web` so a frontend breakage isn't masked by the build
    # matrix re-using the committed internal/webui/dist/.
    needs: [test, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p bin
          go build -o bin/netcheck-${GOOS}-${GOARCH}${ext} .
          ls -lh bin/

      - name: smoke
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./bin/netcheck-linux-amd64 version
